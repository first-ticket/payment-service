plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '3.3.2'
    id 'jacoco'
}

group = 'com.first-ticket'
version = '0.0.1-SNAPSHOT'
description = 'payment-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    asciidoctorExt
}

def env = [:]
def envFile = rootProject.file(".env")
if (envFile.exists()) {
    envFile.eachLine { line ->
        if (line && !line.startsWith("#") && line.contains("=")) {
            def (key, value) = line.split("=", 2)
            env[key.trim()] = value.trim().replaceAll(/^['"]|['"]$/, '')
        }
    }
}

def githubUser = env['GITHUB_USER'] ?: System.getenv('GITHUB_USER')
def githubToken = env['GITHUB_TOKEN'] ?: System.getenv('GITHUB_TOKEN')

if (!githubUser || !githubToken) {
    throw new GradleException("GitHub 인증 정보가 없습니다: .env 파일 또는 환경 변수에 GITHUB_USER/GITHUB_TOKEN을 설정하세요.")
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.pkg.github.com/first-ticket/common'
        credentials {
            username = githubUser
            password = githubToken
        }
    }
    maven {
        url = 'https://maven.pkg.github.com/first-ticket/common-messaging'
        credentials {
            username = githubUser
            password = githubToken
        }
    }
    maven {
        url = 'https://maven.pkg.github.com/first-ticket/common-jpa'
        credentials {
            username = githubUser
            password = githubToken
        }
    }
}

ext {
    set('springCloudVersion', '2025.0.2')
    snippetsDir = file("build/generated-snippets")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'com.first-ticket:common:0.0.4-SNAPSHOT'
    implementation 'com.first-ticket:common-messaging:0.0.2-SNAPSHOT'
    implementation 'com.first-ticket:common-jpa:0.0.2-SNAPSHOT'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    runtimeOnly 'io.zipkin.reporter2:zipkin-reporter-brave'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    outputs.dir snippetsDir
}

asciidoctor {
    inputs.dir snippetsDir
    dependsOn test
    configurations 'asciidoctorExt'
    baseDirFollowsSourceFile()
    attributes(
        'snippets': snippetsDir
    )
}

tasks.named('asciidoctor') {
    doFirst {
        delete file('src/main/resources/static/docs')
    }
}

tasks.register('copyDocument', Copy) {
    dependsOn asciidoctor
    from layout.buildDirectory.dir("docs/asciidoc")
    into layout.projectDirectory.dir("src/main/resources/static/docs")
}

tasks.register('docs') {
    dependsOn copyDocument
    description = 'REST Docs 빌드 (test → asciidoctor → copy)'
    group = 'documentation'
}

bootJar {
    // Rest Docs는 개발 환경에서만 사용
    // 도커 빌드 시 테스트 실행 방지를 위해 asciidoctor 의존성 제거
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                "**/infrastructure/messaging/**",
                "**/infrastructure/external/**",
                "**/infrastructure/persistence/**",
                "**/infrastructure/config/**",
                "**/domain/QPayment.class",
                "**/domain/QPaymentHistory.class",
                "**/application/PaymentScheduler.class",
                "**/presentation/PaymentInternalController.class",
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.50 // 최소 50% 커버리지
            }
        }
    }
}
